# =============================================================================
# go-mysql-elasticsearch 配置：api_request_record (saisiyun iot 项目)
#
# 关联文档：
#   - 部署手册：iot_cloud_platform_server/api_request_record_es_deployment.md
#   - ES 索引模板：iot_cloud_platform_server/scripts/es/index_template.json
#   - ILM 策略：iot_cloud_platform_server/scripts/es/ilm_policy.json
#   - 分表迁移：iot_cloud_platform_server/scripts/migrate_api_request_record_sharding.sql
#
# 设计要点：
#   1. 源端：MySQL 单表 api_request_record（sharding.mode=single 下 compkg 返回固定表名）
#   2. 目标：ES 别名 api_request_record（写入索引由 ILM rollover 自动管理）
#   3. 字段：MySQL snake_case → ES camelCase，filter 白名单排除 is_smart_card / deleted_at
#   4. PK：MySQL 主键 id 直接作为 ES _id
# =============================================================================

# ----- MySQL 连接 -----
# 复制账号需要权限：SELECT, REPLICATION SLAVE, REPLICATION CLIENT
# 推荐用 ${ENV} 占位符注入凭证，避免 toml 明文密码：
#   docker run -e MY_PASS=xxx ...
#   k8s secret -> envFrom
# expandEnvVars 会在解析前替换，未设置的变量保留原字面不报错
my_addr = "${MY_ADDR}"
my_user = "${MY_USER}"
my_pass = "${MY_PASS}"
my_charset = "utf8mb4"

# ----- Elasticsearch 连接 -----
es_https = false
es_addr = "${ES_ADDR}"
es_user = "${ES_USER}"
es_pass = "${ES_PASS}"

# ----- ES TLS 配置（仅 es_https=true 时生效）-----
# es_ca_file：私有 CA 证书路径，留空走系统根证书
# es_insecure_skip_tls：默认 false，仅联调/自签证书快速验证可临时设 true
# es_ca_file = "/etc/ssl/es-ca.pem"
# es_insecure_skip_tls = false

# ----- ES HTTP 客户端调优 -----
# es_request_timeout：单次 bulk/索引请求超时，ES 故障时避免管道永久阻塞
# es_max_idle_conns_per_host：连接池上限，bulk_size×流量 越大越要调高
es_request_timeout = "30s"
es_max_idle_conns_per_host = 32

# ----- 状态存储 -----
# master.info 持久化 binlog 位点，断点续传依赖此目录
# 生产建议挂载到独立磁盘卷，避免容器重启丢位点
data_dir = "/var/lib/go-mysql-es-iot"
# master_fsync：写入 master.info 后强制 fsync 文件与父目录，保证断电不丢位点
# 默认开启，性能极敏感场景可关（不推荐）
# master_fsync = true

# ----- 内置 HTTP 指标端点 -----
# 暴露 /metrics（Prometheus 格式），核心指标：
#   mysql2es_canal_state         同步状态 0/1
#   mysql2es_canal_delay         主从延迟（秒）
#   mysql2es_inserted/updated/deleted_num  按 index 累计文档数
#   mysql2es_bulk_error_total    bulk 失败明细 (action,index,status)
#   mysql2es_bulk_retry_total    bulk 整体重试次数
#   mysql2es_bulk_duration_seconds  bulk 耗时分布
#   mysql2es_sync_ch_size        内部 chan 占用，背压感知
#   mysql2es_master_save_duration_seconds  master.info 落盘耗时
# 生产强烈建议绑定 127.0.0.1 + 反代鉴权；容器场景按需 0.0.0.0
stat_addr = "0.0.0.0:12800"
stat_path = "/metrics"

# ----- binlog 伪从配置 -----
# server_id 全网唯一，避免与真实 slave / 其他 CDC 工具冲突
# 建议命名规则：业务 ID + 实例序号，例如 iot 项目固定 50xx 段
server_id = 5001
flavor = "mysql"
# use_gtid：COM_BINLOG_DUMP_GTID（auto-position）。云库变配/主从切换后面位点会变，
# 必须开；未开 gtid_mode 才设 false。默认 true。
# 从老 master.info（只有 bin_name/bin_pos）升级时：若 Dump 已 waiting for more updates，
# 首次会用当前 GTID_EXECUTED 续订，无缺口。
use_gtid = true

# ----- mysqldump 初次全量 -----
# 历史数据通过 mysqldump 引导，需保证宿主存在 mysqldump 8.x 二进制
# 4C8G 机器全量阶段会短暂占用 1-2GB 内存，过后释放
mysqldump = "mysqldump"
# 如果复制账号无 SUPER 权限（云数据库常见），需要 skip_master_data
skip_master_data = false

# ----- bulk 写入参数 -----
# bulk_size = 2000：单批 2000 条，4G 机器实测内存峰值 < 200MB
# flush_bulk_time = "500ms"：500ms 内必刷一次，保证端到端延迟 < 1s
bulk_size = 2000
flush_bulk_time = "500ms"

# ----- bulk 重试（应对 ES 抖动）-----
# bulk_max_retry：单次 bulk 失败后的重试次数（指数退避），到顶后 cancel 退出
# bulk_retry_initial_backoff：首次重试间隔，后续 ×2 直到 max
# 例：1s -> 2s -> 4s -> 8s -> 16s -> 30s 上限封顶
bulk_max_retry = 5
bulk_retry_initial_backoff = "1s"
bulk_retry_max_backoff = "30s"

# ----- 内部 chan 容量 -----
# 默认 4096，背压圈大；生产 5000+ qps 可调高到 8192
sync_ch_size = 4096

# ----- 安全开关 -----
skip_no_pk_table = false

# =============================================================================
# 数据源：MySQL 单表 api_request_record
# 项目业务侧 sharding.mode=single，compkg.sharding.ApiRequestRecordTable() 返回固定表名
# 早期 scripts/migrate_api_request_record_sharding.sql 的 64 分表方案已废弃
# =============================================================================
[[source]]
schema = "iot_cloud"
tables = ["api_request_record"]

# =============================================================================
# 同步规则：单表 → ES 索引别名
# 别名 api_request_record 由 ILM rollover 自动指向当前 write index
# =============================================================================
[[rule]]
schema = "iot_cloud"
table = "api_request_record"

# ES 写入目标：别名 api_request_record（ILM 管理的 rollover 别名）
# 经过 elastic/client.go 改造后，type 字段不再发往 ES，但保留配置不报错
index = "api_request_record"
type = "_doc"

# 主键映射：默认用 MySQL PK 列 id（沿用 TableInfo.PKColumns 自动识别）
# id = ["id"]  # 取消注释也等价

# 只同步白名单字段（MySQL snake_case 名）
# 排除：
#   - is_smart_card：iot_cloud_platform_open 内部字段，ES 模板未声明（dynamic: strict 会拒收）
#   - deleted_at：软删标记，ES 端无对应字段
filter = [
    "id",
    "account_id",
    "record_id",
    "device_no",
    "data_type",
    "request_type",
    "callback_code",
    "callback_elapsed_time",
    "callback_msg",
    "callback_time",
    "callback_url",
    "device_recv_time",
    "device_reported_time",
    "query_time",
    "response_elapsed_time",
    "response_time",
    "request_message",
    "response_message",
    "msg_id",
    "retry",
    "created_at",
    "updated_at",
    "status",
]

# 字段映射：MySQL snake_case → ES camelCase
# 与 scripts/es/index_template.json 的 properties 严格对齐
# id / retry / status 因名字一致，无需映射
[rule.field]
account_id = "accountId"
record_id = "recordId"
device_no = "deviceNo"
data_type = "dataType"
request_type = "requestType"
callback_code = "callbackCode"
callback_elapsed_time = "callbackElapsedTime"
callback_msg = "callbackMsg"
callback_time = "callbackTime"
callback_url = "callbackUrl"
device_recv_time = "deviceRecvTime"
device_reported_time = "deviceReportedTime"
query_time = "queryTime"
response_elapsed_time = "responseElapsedTime"
response_time = "responseTime"
request_message = "requestMessage"
response_message = "responseMessage"
msg_id = "msgId"
created_at = "createdAt"
updated_at = "updatedAt"
